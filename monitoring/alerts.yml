groups:
  - name: antigravity
    rules:
      # ================================
      # HTTP Alerts
      # ================================
      - alert: HighErrorRate
        expr: rate(http_requests_total{status_code=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | printf \"%.2f\" }}% over the last 5 minutes"

      - alert: SlowResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow API response times"
          description: "P95 response time is {{ $value | printf \"%.2f\" }}s"

      # ================================
      # Infrastructure Alerts
      # ================================
      - alert: DatabaseDown
        expr: up{job="mongodb"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MongoDB is down"
          description: "MongoDB has been unreachable for more than 1 minute"

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis has been unreachable for more than 1 minute"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"}) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space running low"
          description: "Available disk space is {{ $value | printf \"%.0f\" }}%"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | printf \"%.0f\" }}%"

      # ================================
      # Scraper Alerts
      # ================================
      - alert: ScraperHighFailureRate
        expr: rate(scraper_jobs_total{status="failed"}[15m]) / rate(scraper_jobs_total[15m]) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High scraper failure rate"
          description: "Scraper {{ $labels.actor }} has >20% failure rate"

      - alert: QueueDepthHigh
        expr: queue_depth > 100
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Job queue depth is high"
          description: "Queue {{ $labels.queue_name }} has {{ $value }} pending jobs"
