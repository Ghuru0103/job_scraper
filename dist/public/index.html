<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GS Store — Native Job Scraper Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0c10;
      --bg-secondary: #12151e;
      --bg-card: #181c28;
      --bg-card-hover: #202536;
      --bg-elevated: #242a3e;
      --border-subtle: rgba(255,255,255,0.08);
      --glass-bg: rgba(18, 21, 30, 0.75);
      --glass-border: rgba(255,255,255,0.12);

      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;

      --accent-primary: #6366f1;
      --accent-secondary: #8b5cf6;
      --accent-tertiary: #ec4899;
      --accent-green: #10b981;
      --accent-red: #ef4444;

      --gradient-primary: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
      --gradient-card: linear-gradient(135deg, rgba(99,102,241,0.15) 0%, rgba(139,92,246,0.05) 100%);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;

      --shadow-glow: 0 0 30px rgba(99, 102, 241, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 1280px; margin: 0 auto; padding: 0 1.5rem; }
    .text-gradient {
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .grid-bg {
      background-size: 30px 30px;
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card:hover {
      border-color: rgba(99,102,241,0.3);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px -10px rgba(0,0,0,0.5);
    }

    .badge {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.25rem 0.625rem; border-radius: var(--radius-full);
      font-size: 0.725rem; font-weight: 600;
    }
    .badge-purple { background: rgba(99,102,241,0.15); color: #a5b4fc; border: 1px solid rgba(99,102,241,0.3); }
    .badge-green { background: rgba(16,185,129,0.15); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
    .badge-orange { background: rgba(245,158,11,0.15); color: #fcd34d; border: 1px solid rgba(245,158,11,0.3); }
    .badge-red { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
    .badge-gray { background: var(--bg-elevated); color: var(--text-secondary); border: 1px solid var(--border-subtle); }

    .tag {
      padding: 0.15rem 0.5rem; background: var(--bg-secondary);
      border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
      font-size: 0.725rem; color: var(--text-secondary);
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 0.625rem 1.25rem; border-radius: var(--radius-md); font-size: 0.875rem;
      font-weight: 600; border: none; cursor: pointer; transition: all 0.2s ease;
    }
    .btn-primary {
      background: var(--gradient-primary); color: white;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }
    .btn-primary:hover { opacity: 0.95; transform: translateY(-1px); }
    .btn-secondary {
      background: var(--bg-card); color: var(--text-primary);
      border: 1px solid var(--border-subtle);
    }
    .btn-secondary:hover { background: var(--bg-card-hover); }
    .btn-ghost { background: transparent; color: var(--text-secondary); }
    .btn-ghost:hover { background: var(--bg-card); color: var(--text-primary); }
    .btn-sm { padding: 0.4rem 0.875rem; font-size: 0.8rem; }

    .input-group { position: relative; }
    .input-icon { position: absolute; left: 0.875rem; top: 50%; transform: translateY(-50%); font-size: 1rem; color: var(--text-muted); }
    .input {
      width: 100%; padding: 0.625rem 0.875rem 0.625rem 2.5rem;
      background: var(--bg-card); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md); color: var(--text-primary); font-size: 0.875rem;
      outline: none; transition: border-color 0.2s ease;
    }
    select.input { padding-left: 0.875rem; appearance: none; }
    .input:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 2px rgba(99,102,241,0.2); }

    .skeleton {
      background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-card-hover) 50%, var(--bg-card) 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }
    @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  </style>
</head>
<body>
  <app-root></app-root>
  <script src="/bundle.js"></script>
</body>
</html>
